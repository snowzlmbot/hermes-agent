name: Mobile iOS

on:
  workflow_dispatch:
  push:
    branches:
      - hermes-agent-Mobile-app
    paths:
      - apps/mobile/ios/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/mobile/ios/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/xcodegen"
          xcodegen_bin="$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen"
          test -f "$xcodegen_bin"
          chmod +x "$xcodegen_bin"
          echo "$(dirname "$xcodegen_bin")" >> "$GITHUB_PATH"
          "$xcodegen_bin" --version
      - name: Verify XcodeGen
        run: xcodegen --version
      - name: Generate project
        working-directory: apps/mobile/ios
        run: xcodegen generate
      - name: Select simulator
        id: simulator
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          preferred = ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro", "iPhone 16")
          devices = [d for rows in data["devices"].values() for d in rows if d.get("isAvailable")]
          for name in preferred:
              for device in devices:
                  if device.get("name") == name:
                      print(device["udid"])
                      raise SystemExit
          if not devices:
              raise SystemExit("no available iOS simulator")
          print(devices[0]["udid"])
          ')"
          echo "udid=$device" >> "$GITHUB_OUTPUT"
      - name: Build and test iOS app
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild \
            -project HermesMobile.xcodeproj \
            -scheme HermesMobile \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -derivedDataPath "$RUNNER_TEMP/HermesMobileDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/HermesMobile.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            test
      - name: Upload iOS result bundle
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: hermes-mobile-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/HermesMobile.xcresult
            ${{ runner.temp }}/HermesMobileDerivedData/Build/Products/Debug-iphonesimulator/HermesMobile.app
          if-no-files-found: warn
          retention-days: 14
