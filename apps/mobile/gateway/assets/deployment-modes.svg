<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="t d">
<title id="t">Hermes Mobile deployment modes</title><desc id="d">Remote Linux uses TLS ingress and systemd. Same-device Termux uses loopback HTTP and foreground launch.</desc>
<rect width="1000" height="360" rx="24" fill="#0f172a"/><text x="500" y="42" text-anchor="middle" fill="#f8fafc" font-size="25" font-family="sans-serif" font-weight="700">选择正确的安装模式</text>
<g font-family="sans-serif"><rect x="45" y="75" width="420" height="235" rx="20" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="255" y="112" text-anchor="middle" fill="#bfdbfe" font-size="21" font-weight="700">远端 Linux / 服务器</text><text x="75" y="150" fill="#e2e8f0" font-size="16">✓ probe → install --dry-run → install</text><text x="75" y="182" fill="#e2e8f0" font-size="16">✓ systemd --user 激活</text><text x="75" y="214" fill="#e2e8f0" font-size="16">✓ App端点：https://host:port</text><text x="75" y="246" fill="#e2e8f0" font-size="16">✓ TLS ingress → 127.0.0.1:9120</text><text x="75" y="280" fill="#fca5a5" font-size="14">禁止远程HTTP与直接暴露loopback端口</text>
<rect x="535" y="75" width="420" height="235" rx="20" fill="#14532d" stroke="#4ade80" stroke-width="2"/><text x="745" y="112" text-anchor="middle" fill="#bbf7d0" font-size="21" font-weight="700">同一 Android 的 Termux</text><text x="565" y="150" fill="#e2e8f0" font-size="16">✓ probe → install --dry-run --no-activate</text><text x="565" y="182" fill="#e2e8f0" font-size="16">✓ bin/launch 前台运行</text><text x="565" y="214" fill="#e2e8f0" font-size="16">✓ App端点：http://127.0.0.1:9120</text><text x="565" y="246" fill="#e2e8f0" font-size="16">✓ 显式 --allow-loopback-http</text><text x="565" y="280" fill="#fde68a" font-size="14">仅同设备Beta Debug；不可改为LAN/WAN IP</text></g>
</svg>
