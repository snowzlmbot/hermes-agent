name: HermesMobile

options:
  bundleIdPrefix: com.snowzlmbot.hermes
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES

schemes:
  HermesMobile:
    shared: true
    build:
      targets:
        HermesMobile: all
        HermesMobileTests: [test]
        HermesMobileUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: HermesMobileTests
          parallelizable: true
        - name: HermesMobileUITests
          parallelizable: false
    archive:
      config: Release

targets:
  HermesMobile:
    type: application
    platform: iOS
    sources:
      - path: HermesMobile
        excludes:
          - Resources
      - path: HermesMobile/Resources
        excludes:
          - Info.plist
          - Info-Debug.plist
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowzlmbot.hermes.mobile
        PRODUCT_NAME: HermesMobile
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        Debug:
          INFOPLIST_FILE: HermesMobile/Resources/Info-Debug.plist
        Release:
          INFOPLIST_FILE: HermesMobile/Resources/Info.plist

  HermesMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesMobileTests
        excludes:
          - Info.plist
    dependencies:
      - target: HermesMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowzlmbot.hermes.mobile.tests
        INFOPLIST_FILE: HermesMobileTests/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesMobile.app/HermesMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HermesMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HermesMobileUITests
    dependencies:
      - target: HermesMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowzlmbot.hermes.mobile.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesMobile
        SUPPORTS_MACCATALYST: NO